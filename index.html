<style>
/* 奥数豆豆 — iPad 触屏优先的护眼样式 */

:root {
  --bg: #fdf8ef;
  --card: #fffdf8;
  --card-edge: #ecdfc8;
  --ink: #4d4238;
  --ink-soft: #857767;
  --ink-faint: rgba(92, 80, 66, 0.5);
  --accent: #f0a94a;
  --accent-deep: #cf8420;
  --accent-soft: #ffe8c2;
  --good: #6bc06f;
  --good-soft: #e4f6e4;
  --bad: #e2836f;
  --bad-soft: #fdeae6;
  --shadow: rgba(120, 102, 80, 0.13);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 18px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ---------------- 主内容区 ---------------- */
#view {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.page {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.page.center {
  justify-content: center;
  min-height: 100%;
}

/* ---------------- 底部导航 ---------------- */
#tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  background: rgba(255, 253, 248, 0.97);
  border-top: 1px solid var(--card-edge);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 20;
}

#tabs button {
  flex: 1;
  border: 0;
  background: none;
  padding: 8px 0 10px;
  font-size: 22px;
  line-height: 1.1;
  color: var(--ink-soft);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-family: inherit;
  min-height: 58px;
}

#tabs button span {
  font-size: 13px;
}

#tabs button.on {
  color: var(--accent-deep);
  font-weight: 700;
}

#tabs button:active {
  background: rgba(240, 169, 74, 0.12);
}

/* ---------------- 卡片 ---------------- */
.card {
  background: var(--card);
  border: 1.5px solid var(--card-edge);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 3px 10px var(--shadow);
}

.card-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--accent-deep);
  margin-bottom: 10px;
}

.card-title.big-title {
  font-size: 24px;
  text-align: center;
}

.muted { color: var(--ink-soft); }
.small { font-size: 15px; }

/* ---------------- 头部豆子区 ---------------- */
.hero {
  background: linear-gradient(180deg, #fff6e3, #fffdf8);
  border: 1.5px solid #f0d9ad;
  border-radius: 22px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 4px 14px var(--shadow);
}

.hero-left { display: flex; flex-direction: column; gap: 6px; }
.hero-label { font-size: 15px; color: var(--ink-soft); }
.hero-right { text-align: right; display: flex; flex-direction: column; gap: 4px; }
.hero-stat { font-size: 15px; color: var(--ink-soft); }

.bean-chip {
  display: flex;
  align-items: center;
  gap: 6px;
}

.bean-chip .bean-num {
  font-size: 40px;
  font-weight: 800;
  color: var(--accent-deep);
  line-height: 1;
}

.bean-chip.big .bean-num { font-size: 52px; }

.bean-svg { display: block; }

@keyframes popnum {
  0% { transform: scale(1); }
  45% { transform: scale(1.35); }
  100% { transform: scale(1); }
}
.pop { animation: popnum 0.5s ease-out; }

/* ---------------- 进度条 ---------------- */
.progress-wrap { display: flex; flex-direction: column; gap: 6px; }

.progress-track {
  height: 14px;
  background: #f2e9d8;
  border-radius: 8px;
  overflow: hidden;
}

.progress-track.thin { height: 9px; }

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #f6c877, #f0a94a);
  border-radius: 8px;
  transition: width 0.35s ease;
}

.progress-fill.goal-fill { background: linear-gradient(90deg, #8ed08a, #6bc06f); }

.progress-text { font-size: 14px; color: var(--ink-soft); text-align: center; }

/* ---------------- 目标 ---------------- */
.goal {
  background: var(--good-soft);
  border: 1.5px solid #bfe4bf;
  border-radius: 16px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.goal-head { display: flex; justify-content: space-between; font-size: 16px; }
.goal-num { font-weight: 700; color: #4a9e4f; }

/* ---------------- 按钮 ---------------- */
button { font-family: inherit; }

.btn-primary {
  border: 0;
  border-radius: 16px;
  background: linear-gradient(180deg, #f7c877, #e8a33d);
  color: #4a3210;
  font-size: 20px;
  font-weight: 700;
  padding: 14px 20px;
  box-shadow: 0 4px 12px rgba(200, 140, 40, 0.28);
  width: 100%;
}

.btn-primary.big { font-size: 22px; padding: 18px 20px; border-radius: 18px; }
.btn-primary:active { transform: translateY(1px); box-shadow: 0 2px 6px rgba(200, 140, 40, 0.3); }

.btn-ghost {
  border: 1.5px solid var(--card-edge);
  background: var(--card);
  color: var(--ink);
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 17px;
  min-height: 48px;
}

.btn-ghost.small { font-size: 15px; padding: 9px 13px; min-height: 40px; border-radius: 12px; }
.btn-ghost:active { background: var(--accent-soft); }

.btn-danger {
  border: 1.5px solid #f0c4b8;
  background: var(--bad-soft);
  color: #b8523a;
  border-radius: 12px;
  padding: 9px 13px;
  font-size: 15px;
  min-height: 40px;
}

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* ---------------- 出题设置 ---------------- */
.opt-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.opt-label { font-size: 15px; color: var(--ink-soft); width: 42px; padding-top: 8px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }

.chip {
  border: 1.5px solid var(--card-edge);
  background: var(--card);
  color: var(--ink);
  border-radius: 12px;
  padding: 8px 14px;
  font-size: 16px;
  min-height: 42px;
}

.chip.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-deep);
  font-weight: 700;
}

.tip {
  font-size: 14.5px;
  color: var(--ink-soft);
  background: #fdf3e0;
  border: 1.5px solid #f2e2c4;
  border-radius: 14px;
  padding: 12px 14px;
}

/* ---------------- 做题 ---------------- */
.quiz-head { display: flex; gap: 8px; flex-wrap: wrap; }

.tag {
  font-size: 14px;
  background: #eef4fb;
  color: #4a7ba8;
  border-radius: 10px;
  padding: 5px 11px;
}

.tag-star { background: var(--accent-soft); color: var(--accent-deep); }

.qtext {
  background: var(--card);
  border: 1.5px solid var(--card-edge);
  border-radius: 18px;
  padding: 20px 18px;
  font-size: 23px;
  line-height: 1.7;
  box-shadow: 0 3px 10px var(--shadow);
}

.q-line + .q-line { margin-top: 6px; }

.answer-box {
  border-radius: 18px;
  padding: 14px 18px;
  background: #fff8e8;
  border: 2px dashed #eccf9a;
  text-align: center;
}

.answer-box.ok { background: var(--good-soft); border: 2px solid #9ed89e; }
.answer-box.no { background: var(--bad-soft); border: 2px solid #efb6a6; }

.answer-label { font-size: 14px; color: var(--ink-soft); }
.answer-value { font-size: 46px; font-weight: 800; color: var(--accent-deep); line-height: 1.15; }
.answer-value.empty { color: #d9c9a8; }
.answer-box.ok .answer-value { color: #3f8f45; }
.answer-box.no .answer-value { color: #b8523a; }
.answer-note { font-size: 16px; color: var(--ink-soft); margin-top: 2px; }
.got-bean { color: var(--accent-deep); font-weight: 700; }

.explain-body { font-size: 17px; line-height: 1.75; color: var(--ink); }
.explain-body div + div { margin-top: 4px; }

.quiz-actions { display: flex; gap: 10px; }
.quiz-actions button { flex: 1; }

/* ---------------- 数字键盘 ---------------- */
.pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.pad-key {
  border: 1.5px solid var(--card-edge);
  background: var(--card);
  color: var(--ink);
  border-radius: 16px;
  font-size: 30px;
  font-weight: 600;
  padding: 6px 0;
  min-height: 68px;
  box-shadow: 0 2px 0 rgba(200, 180, 150, 0.25);
}

.pad-key:active { background: var(--accent-soft); transform: translateY(1px); }
.pad-key.pad-fn { font-size: 20px; color: var(--ink-soft); background: #faf5ec; }

/* iPad 竖屏空间很足，键盘做大一点更好按 */
@media (min-height: 900px) {
  .pad-key { min-height: 84px; font-size: 34px; border-radius: 18px; }
  .pad-key.pad-fn { font-size: 22px; }
  .pad-submit { min-height: 78px; font-size: 28px; }
  .qtext { font-size: 25px; padding: 24px 20px; }
  .answer-value { font-size: 54px; }
  .bean-chip .bean-num { font-size: 48px; }
  #view { padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
}

.tab-icon { display: block; line-height: 0; }
.inline-bean { display: inline-block; vertical-align: -4px; line-height: 0; }

/* ---------------- 云同步 ---------------- */
.cloud-status {
  font-size: 14.5px;
  padding: 9px 12px;
  border-radius: 10px;
  margin: 8px 0;
  background: #f4f1ea;
  color: var(--ink-soft);
  line-height: 1.5;
}

.cloud-ok { background: var(--good-soft); color: #3f8f45; }
.cloud-error { background: var(--bad-soft); color: #b8523a; }
.cloud-syncing { background: #eef4fb; color: #4a7ba8; }
.cloud-idle { background: #fdf6e8; color: var(--accent-deep); }
.cloud-off { background: #f4f1ea; color: var(--ink-soft); }

.howto { margin-top: 10px; }

.howto summary {
  cursor: pointer;
  font-size: 15px;
  color: #4a7ba8;
  padding: 8px 0;
  list-style: none;
}

.howto summary::-webkit-details-marker { display: none; }

.howto-body {
  font-size: 14.5px;
  line-height: 1.7;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 4px;
}

.howto-body .textarea { margin-top: 4px; }

/* ---------------- 只读报告 ---------------- */
.kv { display: flex; flex-direction: column; }
.kv-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #f2ead9;
  font-size: 16px;
}
.kv-row:last-child { border-bottom: 0; }
.kv-k { color: var(--ink-soft); }
.kv-v { font-weight: 700; color: var(--ink); }

/* ---------------- 家长自己出的题 ---------------- */
.custom-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

.custom-item {
  background: #fdf6e8;
  border: 1.5px solid #f0e2c8;
  border-radius: 12px;
  padding: 10px 12px;
}

.custom-q { font-size: 16px; margin-bottom: 6px; }

.custom-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  color: var(--ink-soft);
}

select.input {
  appearance: none;
  -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, #b0a08a 50%),
                    linear-gradient(135deg, #b0a08a 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  min-height: 44px;
}

.pad-submit {
  grid-column: 1 / -1;
  background: #f2e9d8;
  color: var(--ink-soft);
  font-size: 24px;
  min-height: 66px;
}

.pad-submit.ready {
  background: linear-gradient(180deg, #7fd07f, #5cb862);
  color: #fff;
  border-color: #4ca455;
  box-shadow: 0 4px 12px rgba(80, 170, 90, 0.3);
}

.pad-actions { display: flex; }
.pad-actions button { flex: 1; }

.pin-pad { margin-top: 6px; }

/* ---------------- 家长密码 ---------------- */
.card.gate { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

.pin-dots { display: flex; justify-content: center; gap: 14px; padding: 6px 0; }

.pin-dots .dot {
  width: 18px; height: 18px; border-radius: 50%;
  background: #f0e6d4; border: 2px solid var(--card-edge);
}

.pin-dots .dot.on { background: var(--accent); border-color: var(--accent-deep); }

/* ---------------- 钱包 ---------------- */
.wallet-hero { flex-direction: column; align-items: flex-start; gap: 8px; }

.log { display: flex; flex-direction: column; }

.log-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid #f2ead9;
  font-size: 15.5px;
}

.log-item:last-child { border-bottom: 0; }

.log-delta { font-weight: 800; min-width: 46px; font-size: 17px; }
.log-earn .log-delta { color: var(--accent-deep); }
.log-parent .log-delta { color: #4a7ba8; }
.log-spend .log-delta { color: #b8523a; }
.log-note { flex: 1; color: var(--ink); }
.log-time { color: var(--ink-faint); font-size: 13.5px; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}

.stat {
  background: #fdf6e8;
  border-radius: 12px;
  padding: 10px 4px;
  text-align: center;
  display: flex;
  flex-direction: column;
}

.stat b { font-size: 22px; color: var(--accent-deep); }
.stat span { font-size: 12.5px; color: var(--ink-soft); }

.stars-stat { display: flex; flex-direction: column; gap: 7px; }

.stars-row { display: flex; align-items: center; gap: 10px; }
.stars-label { font-size: 14px; width: 82px; flex: none; color: var(--ink-soft); }
.stars-row .progress-track { flex: 1; }
.stars-num { font-size: 13.5px; color: var(--ink-soft); width: 54px; text-align: right; flex: none; }

/* ---------------- 家长面板 ---------------- */
.parent-beans { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.parent-bean-num { font-size: 34px; font-weight: 800; color: var(--accent-deep); }

.field-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.field-label { font-size: 15px; color: var(--ink-soft); }

.input, .textarea {
  border: 1.5px solid var(--card-edge);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 17px;
  font-family: inherit;
  color: var(--ink);
  background: #fffefb;
  flex: 1;
  min-width: 90px;
  -webkit-user-select: text;
  user-select: text;
}

.textarea { width: 100%; resize: vertical; font-size: 13px; line-height: 1.4; margin-bottom: 8px; }

/* ---------------- 特效 ---------------- */
.bean-fly {
  position: fixed;
  z-index: 60;
  font-size: 34px;
  pointer-events: none;
  transition: transform 0.72s cubic-bezier(0.3, -0.2, 0.7, 1), opacity 0.72s ease-in;
  will-change: transform, opacity;
}

.toast {
  position: fixed;
  left: 50%;
  top: calc(18px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  background: rgba(77, 66, 56, 0.94);
  color: #fff8ec;
  padding: 11px 20px;
  border-radius: 14px;
  font-size: 16px;
  z-index: 70;
  transition: opacity 0.4s, transform 0.4s;
  max-width: 86vw;
  text-align: center;
}

.toast-warn { background: rgba(190, 100, 70, 0.96); }
.toast-out { opacity: 0; transform: translateX(-50%) translateY(-12px); }

/* ---------------- 横屏 / 大屏微调 ---------------- */
@media (min-width: 820px) {
  .page { max-width: 820px; }
  .qtext { font-size: 25px; }
}

@media (orientation: landscape) and (max-height: 620px) {
  #view { padding-top: 10px; }
  .qtext { font-size: 20px; padding: 14px; }
  .answer-value { font-size: 36px; }
  .pad-key { min-height: 54px; font-size: 26px; }
  .bean-chip .bean-num { font-size: 34px; }
}
</style>

  <script>
/* ===== utils.js ===== */
/* 奥数豆豆 — 通用工具 */
window.G = window.G || {};
(function (G) {
  'use strict';

  /* 可复现随机数：同一个种子出同一道题，方便测试和截图 */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var U = {
    mulberry32: mulberry32,
    /* 用字符串或数字做种子 */
    seedOf: function (s) {
      if (typeof s === 'number') return s >>> 0;
      var h = 2166136261;
      s = String(s);
      for (var i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    },
    rng: function (seed) { return mulberry32(U.seedOf(seed === undefined ? Date.now() : seed)); },

    /* rng 相关的随机工具 */
    ri: function (r, a, b) { return a + Math.floor(r() * (b - a + 1)); },
    pick: function (r, arr) { return arr[Math.floor(r() * arr.length)]; },
    chance: function (r, p) { return r() < p; },
    shuffle: function (r, arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(r() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
    /* 从 lo..hi 里不重复地取 n 个数 */
    sample: function (r, lo, hi, n) {
      var pool = [];
      for (var v = lo; v <= hi; v++) pool.push(v);
      return U.shuffle(r, pool).slice(0, n).sort(function (a, b) { return a - b; });
    },

    clamp: function (v, a, b) { return v < a ? a : (v > b ? b : v); },
    /* 千分位 */
    fmt: function (n) {
      var s = String(n);
      var neg = s.charAt(0) === '-';
      if (neg) s = s.slice(1);
      var out = '';
      for (var i = 0; i < s.length; i++) {
        if (i > 0 && (s.length - i) % 3 === 0) out += ',';
        out += s.charAt(i);
      }
      return (neg ? '-' : '') + out;
    },
    gcd: function (a, b) { while (b) { var t = a % b; a = b; b = t; } return a; },
    lcm: function (a, b) { return a / U.gcd(a, b) * b; },

    /* 星期几的中文 */
    weekday: function (n) { return '一二三四五六日'.charAt(((n - 1) % 7 + 7) % 7); },

    {
      id: 'calendar-sundays', topic: 'number', grade: '5', stars: 2,
      make: function (r) {
        var D = pick(r, [28, 29, 30, 31]);
        var s = ri(r, 1, 7);
        var c = 0;
        for (var d = 1; d <= D; d++) if (((s - 1 + d - 1) % 7) + 1 === 7) c++;
        return {
          q: '某个月有 ' + D + ' 天，这个月的 1 号是星期' + U.weekday(s) +
             '。这个月一共有几个星期日？',
          answer: c,
          params: { D: D, s: s },
          explain: '1 号是星期' + U.weekday(s) + '，那么第一个星期日是 ' +
                   (((7 - s) % 7) + 1) + ' 号。\n' +
                   '之后每隔 7 天一个，一直数到 ' + D + ' 号，一共 ' + c + ' 个星期日。'
        };
      }
    },

    {
      id: 'multiple-in-range', topic: 'number', grade: '5', stars: 3,
      make: function (r) {
        var k = pick(r, [3, 4, 6, 7, 8, 9, 11, 13]);
        var lo = pick(r, [100, 200, 300]);
        var hi = lo + pick(r, [200, 400, 600, 900]);
        var c = 0;
        for (var v = lo; v <= hi; v++) if (v % k === 0) c++;
        return {
          q: '在 ' + lo + ' 到 ' + hi + ' 之间（包含两端），能被 ' + k + ' 整除的数有多少个？',
          answer: c,
          params: { lo: lo, hi: hi, k: k },
          explain: '先数 1 到 ' + hi + ' 里有多少个：' + hi + ' ÷ ' + k + ' = ' + Math.floor(hi / k) + ' 个；\n' +
                   '再减掉 ' + lo + ' 之前就有的：' + (lo - 1) + ' ÷ ' + k + ' = ' +
                   Math.floor((lo - 1) / k) + ' 个。\n' +
                   Math.floor(hi / k) + ' − ' + Math.floor((lo - 1) / k) + ' = ' + c + ' 个。'
        };
      }
    }

  ];

  /* 有些生成器在参数不巧时会返回 null，这里统一重试 */
  function makeSafe(g, r, tries) {
    for (var i = 0; i < (tries || 20); i++) {
      var out = g.make(r);
      if (out && typeof out.answer === 'number' && isFinite(out.answer)) return out;
    }
    return null;
  }

  function filter(opt) {
    opt = opt || {};
    return GEN.filter(function (g) {
      if (opt.topic && opt.topic !== 'all' && g.topic !== opt.topic) return false;
      if (opt.stars && opt.stars !== 'all' && g.stars !== Number(opt.stars)) return false;
      if (opt.grade && opt.grade !== 'all') {
        if (g.grade !== 'all' && String(g.grade) !== String(opt.grade)) return false;
      }
      return true;
    });
  }

  /* 出题：opt = {topic, stars, grade, customList}，avoid 是最近做过的生成器 id 列表 */
  function next(opt, seed, avoid) {
    opt = opt || {};

    /* 家长自己录入的题目 */
    if (opt.topic === 'custom') {
      var list = opt.customList || [];
      if (list.length) {
        var rc = U.rng(seed);
        var c = pick(rc, list);
        return {
          genId: 'custom',
          topic: 'custom',
          topicName: '家长出的题',
          grade: 'all',
          stars: Math.min(3, Math.max(1, c.s || 2)),
          points: Math.min(3, Math.max(1, c.s || 2)),
          q: c.q,
          answer: c.a,
          explain: c.e || '这道题是家长自己加进来的。',
          params: { custom: true },
          seed: seed
        };
      }
      opt = { grade: opt.grade, stars: opt.stars, topic: 'all' };
    }

    var pool = filter(opt);
    if (!pool.length) pool = GEN.slice();
    if (avoid && avoid.length) {
      var fresh = pool.filter(function (g) { return avoid.indexOf(g.id) < 0; });
      if (fresh.length) pool = fresh;
    }
    var r = U.rng(seed);
    for (var attempt = 0; attempt < 30; attempt++) {
      var g = pick(r, pool);
      var out = makeSafe(g, r);
      if (out) {
        return {
          genId: g.id,
          topic: g.topic,
          topicName: topicName(g.topic),
          grade: g.grade,
          stars: g.stars,
          points: g.stars,
          q: out.q,
          answer: out.answer,
          explain: out.explain,
          params: out.params,
          seed: seed
        };
      }
    }
    /* 兜底：不至于卡死 */
    var g2 = pool[0];
    var out2 = g2.make(U.rng(12345));
    return {
      genId: g2.id, topic: g2.topic, topicName: topicName(g2.topic),
      grade: g2.grade, stars: g2.stars, points: g2.stars,
      q: out2.q, answer: out2.answer, explain: out2.explain, params: out2.params, seed: 12345
    };
  }

  G.TOPICS = TOPICS;
  G.GEN = GEN;
  G.topicName = topicName;
  G.genFilter = filter;
  G.nextQuestion = next;
})(window.G);

  <script>
/* ===== store.js ===== */
/* 奥数豆豆 — 数据层：豆子钱包、积分兑换、流水、家长设置、导出导入 */
window.G = window.G || {};
(function (G) {
  'use strict';

  var U = G.U;
  var KEY = 'mathbean_v1';
  var MAX_LOG = 200;
  var MAX_RECENT = 12;

  function fresh() {
    return {
      v: 1,
      beans: 0,             /* 钱包里的豆子 */
      points: 0,            /* 攒着还没换成豆的积分（余数保留，不会白做） */
      pointsPerBean: 2,     /* 几颗积分换 1 颗豆。1★题 1 分 → 默认做对 2 道基础题得 1 颗豆 */
      goalName: '',
      goalBeans: 0,
      pin: '0000',
      sound: true,
      kidName: '',          /* 孩子名字（报告里会用到） */
      answerMode: 'strict', /* 答案权限：strict 只有家长能看 / gentle 答错后给孩子看 */
      custom: [],           /* 家长自己录入的题目 [{q, a, s, e}] */
      /* 云同步（可选，不填就纯本地） */
      cloudUrl: '',
      cloudKey: '',
      cloudCode: '',
      updatedAt: 0,         /* 本机数据最后一次改动的时间，用来和云端比谁新 */
      stats: {
        total: 0, correct: 0,
        s1: { t: 0, c: 0 },
        s2: { t: 0, c: 0 },
        s3: { t: 0, c: 0 }
      },
      log: [],              /* [{t, type, delta, note}] type: earn | parent | spend */
      recent: [],           /* 最近做过的题型，用来避免连着出同一种 */
      streak: 0,
      bestStreak: 0
    };
  }

  var Store = {
    data: fresh(),

    /* ---------------- 读写 ---------------- */
    load: function () {
      try {
        var s = window.localStorage.getItem(KEY);
        if (s) {
          var d = JSON.parse(s);
          if (d && typeof d.beans === 'number') {
            var base = fresh();
            /* 逐个字段合并，容忍旧版本缺字段 */
            for (var k in base) {
              if (!Object.prototype.hasOwnProperty.call(base, k)) continue;
              if (d[k] === undefined || d[k] === null) continue;
              if (k === 'stats' && typeof d[k] === 'object') {
                base.stats.total = d.stats.total || 0;
                base.stats.correct = d.stats.correct || 0;
                ['s1', 's2', 's3'].forEach(function (sk) {
                  if (d.stats[sk]) {
                    base.stats[sk].t = d.stats[sk].t || 0;
                    base.stats[sk].c = d.stats[sk].c || 0;
                  }
                });
              } else {
                base[k] = d[k];
              }
            }
            this.data = base;
          }
        }
      } catch (e) { /* 隐私模式下就用内存数据 */ }
      return this.data;
    },

    save: function (opts) {
      opts = opts || {};
      if (!opts.noTouch) this.data.updatedAt = Date.now();
      try { window.localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* 忽略 */ }
      /* 每次改动后自动排一次云同步（没配置云同步时什么都不做） */
      if (!opts.noPush && G.Cloud && G.Cloud.schedulePush) G.Cloud.schedulePush();
    },

    reset: function () {
      this.data = fresh();
      this.save();
    },

    /* ---------------- 统计与兑换 ---------------- */

    /* 距离下一颗豆还差几分 */
    pointsToNextBean: function () {
      var need = this.data.pointsPerBean - this.data.points;
      return need > 0 ? need : 0;
    },
    beanProgress: function () {
      /* 0~1，用于画进度条 */
      var p = this.data.pointsPerBean;
      if (p <= 0) return 1;
      return Math.min(1, this.data.points / p);
    },

    /* 答对一题：按难度加分，攒够分自动换豆 */
    award: function (stars) {
      var pts = stars || 1;
      var d = this.data;
      d.stats.total++;
      d.stats.correct++;
      var bucket = d.stats['s' + Math.min(3, Math.max(1, pts))];
      if (bucket) { bucket.t++; bucket.c++; }
      d.streak++;
      if (d.streak > d.bestStreak) d.bestStreak = d.streak;

      d.points += pts;
      var gained = 0;
      while (d.points >= d.pointsPerBean && d.pointsPerBean > 0) {
        d.points -= d.pointsPerBean;
        d.beans++;
        gained++;
      }
      if (gained > 0) {
        this.pushLog('earn', gained, pts + '★ 题答对，攒够 ' + d.pointsPerBean + ' 分');
      }
      this.save();
      return { gained: gained, beans: d.beans, points: d.points, stars: pts };
    },

    /* 答错一题：只记统计，不倒扣豆子（不打击孩子） */
    miss: function (stars) {
      var pts = stars || 1;
      var d = this.data;
      d.stats.total++;
      var bucket = d.stats['s' + Math.min(3, Math.max(1, pts))];
      if (bucket) bucket.t++;
      d.streak = 0;
      this.save();
    },

    /* ---------------- 家长操作 ---------------- */
    addBeans: function (n, note) {
      n = Math.round(n);
      if (!n) return this.data.beans;
      this.data.beans = Math.max(0, this.data.beans + n);
      this.pushLog('parent', n, note || '家长调整');
      this.save();
      return this.data.beans;
    },

    /* 兑换/花掉（比如拿豆换奖励） */
    spendBeans: function (n, note) {
      n = Math.round(n);
      if (n <= 0) return this.data.beans;
      var real = Math.min(n, this.data.beans);
      this.data.beans -= real;
      this.pushLog('spend', -real, note || '兑换奖励');
      this.save();
      return this.data.beans;
    },

    setRate: function (n) {
      n = Math.round(n);
      this.data.pointsPerBean = Math.max(1, Math.min(20, n));
      this.save();
      return this.data.pointsPerBean;
    },

    setGoal: function (name, beans) {
      this.data.goalName = String(name || '').slice(0, 24);
      this.data.goalBeans = Math.max(0, Math.round(beans || 0));
      this.save();
    },

    setPin: function (p) {
      p = String(p || '').replace(/\D/g, '').slice(0, 6);
      if (p.length < 4) return false;
      this.data.pin = p;
      this.save();
      return true;
    },

    setSound: function (on) {
      this.data.sound = !!on;
      this.save();
    },

    pushLog: function (type, delta, note) {
      this.data.log.unshift({ t: Date.now(), type: type, delta: delta, note: note || '' });
      if (this.data.log.length > MAX_LOG) this.data.log.length = MAX_LOG;
    },

    /* ---------------- 出题辅助 ---------------- */
    addRecent: function (genId) {
      var r = this.data.recent;
      if (r.indexOf(genId) < 0) r.unshift(genId);
      if (r.length > MAX_RECENT) r.length = MAX_RECENT;
    },
    recentIds: function () { return this.data.recent.slice(); },

    /* ---------------- 备份 ---------------- */
    exportText: function () {
      return JSON.stringify(this.data, null, 1);
    },
    importText: function (s) {
      try {
        var d = JSON.parse(s);
        if (!d || typeof d.beans !== 'number' || typeof d.points !== 'number') return '数据格式不对';
        this.data = fresh();
        for (var k in this.data) {
          if (Object.prototype.hasOwnProperty.call(d, k) && d[k] !== undefined) this.data[k] = d[k];
        }
        this.save();
        return null;   /* null = 成功 */
      } catch (e) {
        return '数据格式不对：' + e.message;
      }
    },

    /* 正确率 */
    accuracy: function () {
      var s = this.data.stats;
      if (!s.total) return 0;
      return Math.round(s.correct / s.total * 100);
    },

    /* ---------------- 答案权限 ---------------- */
    setAnswerMode: function (m) {
      this.data.answerMode = (m === 'gentle') ? 'gentle' : 'strict';
      this.save();
      return this.data.answerMode;
    },
    /* 孩子能不能看到答案 */
    kidCanSeeAnswer: function () {
      return this.data.answerMode === 'gentle';
    },

    setKidName: function (n) {
      this.data.kidName = String(n || '').slice(0, 12);
      this.save();
    },

    /* ---------------- 家长自己录入题目 ----------------
       答案必须是数字（App 用数字键盘作答，也方便判分） */
    addCustom: function (q, a, stars, explain) {
      q = String(q || '').trim();
      a = String(a === undefined || a === null ? '' : a).trim();
      if (!q) return '题干不能为空';
      if (!/^\d{1,9}$/.test(a)) return '答案要填非负整数（这个 App 用数字键盘作答）';
      var s = parseInt(stars, 10);
      if (!(s >= 1 && s <= 3)) s = 2;
      this.data.custom.push({
        q: q.slice(0, 300),
        a: parseInt(a, 10),
        s: s,
        e: String(explain || '').slice(0, 800)
      });
      this.save();
      return null;
    },
    removeCustom: function (i) {
      if (i >= 0 && i < this.data.custom.length) {
        this.data.custom.splice(i, 1);
        this.save();
      }
    },

    /* ---------------- 家长报告（可以在别的电脑上查看） ---------------- */
    buildReport: function () {
      var d = this.data;
      return {
        v: 1,
        n: d.kidName || '小朋友',
        b: d.beans,          /* 豆子 */
        p: d.points,         /* 零头积分 */
        r: d.pointsPerBean,  /* 兑换比例 */
        g: [d.goalName || '', d.goalBeans || 0],
        s: [d.stats.total, d.stats.correct,
            d.stats.s1.c, d.stats.s1.t, d.stats.s2.c, d.stats.s2.t, d.stats.s3.c, d.stats.s3.t,
            d.bestStreak],
        l: d.log.slice(0, 12).map(function (x) { return [x.t, x.type, x.delta, x.note]; }),
        t: Date.now()
      };
    },
    reportCode: function () {
      return U.b64enc(JSON.stringify(this.buildReport()));
    },
    /* 静态方法：解析报告码（Node 测试里也直接用） */
    parseReport: function (code) {
      try {
        var o = JSON.parse(U.b64dec(code));
        if (!o || typeof o.b !== 'number') return null;
        return o;
      } catch (e) { return null; }
    },

    /* 报告链接：任何一台电脑打开这个链接都能看（数据全在链接里，不需要服务器） */
    reportUrl: function () {
      var base = String(window.location.href).split('#')[0].split('?')[0];
      return base + '#report=' + this.reportCode();
    },

    /* ---------------- 云同步 ---------------- */

    /* 要上传到云端的字段（不含云配置本身，避免互相覆盖） */
    snapshot: function () {
      var d = this.data;
      return {
        v: 1,
        beans: d.beans,
        points: d.points,
        pointsPerBean: d.pointsPerBean,
        goalName: d.goalName,
        goalBeans: d.goalBeans,
        stats: d.stats,
        log: d.log,
        streak: d.streak,
        bestStreak: d.bestStreak,
        custom: d.custom,
        kidName: d.kidName,
        answerMode: d.answerMode,
        sound: d.sound,
        pin: d.pin,
        updatedAt: d.updatedAt
      };
    },

    /* 把云端的整份数据搬到本机（保留本机的云配置） */
    adopt: function (remote, remoteAt) {
      if (!remote || typeof remote.beans !== 'number') return false;
      var snap = this.snapshot();
      for (var k in remote) {
        if (k === 'v') continue;
        if (!Object.prototype.hasOwnProperty.call(snap, k)) continue;
        if (remote[k] === undefined || remote[k] === null) continue;
        snap[k] = remote[k];
      }
      var keep = { cloudUrl: this.data.cloudUrl, cloudKey: this.data.cloudKey, cloudCode: this.data.cloudCode };
      var base = fresh();
      for (var k2 in snap) if (snap[k2] !== undefined) base[k2] = snap[k2];
      base.cloudUrl = keep.cloudUrl;
      base.cloudKey = keep.cloudKey;
      base.cloudCode = keep.cloudCode;
      base.updatedAt = remoteAt || Date.now();
      this.data = base;
      this.save({ noTouch: true, noPush: true });
      return true;
    },

    setCloud: function (url, key, code) {
      this.data.cloudUrl = String(url || '').trim();
      this.data.cloudKey = String(key || '').trim();
      this.data.cloudCode = String(code || '').trim();
      /* 注意：改配置不是改数据，绝不能刷新 updatedAt。
         否则一台空设备只要填了配置就会变成「数据更新的一方」，
         同步时会把孩子真实的豆子覆盖成 0。 */
      this.save({ noTouch: true, noPush: true });
    },

    cloudConfigured: function () {
      var d = this.data;
      return !!(d.cloudUrl && d.cloudKey && d.cloudCode);
    },

    /* 生成一段随机家庭同步码（几台设备填一样的就行） */
    newCloudCode: function () {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var out = '';
      for (var i = 0; i < 12; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    },

    /* 一键配置链接用的编码：把网址 + anon key + 同步码打包成一段字符串 */
    cloudLink: function (url, key, code) {
      return U.b64enc(JSON.stringify({ u: url, k: key, c: code }));
    },
    parseCloudLink: function (s) {
      try {
        var o = JSON.parse(U.b64dec(String(s || '').trim()));
        if (!o || !o.u || !o.k || !o.c) return null;
        return o;
      } catch (e) { return null; }
    },

    /* ---------------- 手动同步码（不想配云的时候用这个） ---------------- */

    /* 把本机全部数据编码成一段可以复制走的文本 */
    syncCode: function () {
      return U.b64enc(JSON.stringify(this.snapshot()));
    },

    /* 用别人给的同步码覆盖本机（保留本机的云配置） */
    applySyncCode: function (code) {
      try {
        var o = JSON.parse(U.b64dec(String(code || '').trim()));
        if (!o || typeof o.beans !== 'number') return '同步码无效';
        this.adopt(o, o.updatedAt || Date.now());
        return null;
      } catch (e) {
        return '同步码无效';
      }
    }
  };

  G.Store = Store;
})(window.G);

  <script>
/* ===== cloud.js ===== */
/* 奥数豆豆 — 云同步（可选）
 *
 * 不配置的时候完全不影响使用（数据照旧存在本机）。
 * 配置之后，多台设备（iPad + 电脑）就能共用同一份豆子数据。
 *
 * 用的是 Supabase 的免费数据库（它给浏览器的 anon key 本来就是公开的，
 * 放在 App 设置里是安全的；真正的门锁是「家庭同步码」）。
 *
 * 同步策略：谁的 updatedAt 更新就用谁的。孩子主要在 iPad 上做题，
 * 家长电脑上通常只是看看或偶尔加减豆子，这个策略足够稳。
 */
window.G = window.G || {};
(function (G) {
  'use strict';
  var U = G.U, S = G.Store;

  var Cloud = {
    status: 'off',       /* off | idle | syncing | ok | error */
    message: '',
    _timer: null,
    _busy: false,
    _applying: false,    /* 正在把云端数据写到本机时，不要反过来推回去 */

    configured: function () {
      var d = S.data;
      return !!(d.cloudUrl && d.cloudKey && d.cloudCode);
    },

    endpoint: function () {
      var base = String(S.data.cloudUrl || '').trim().replace(/\/+$/, '');
      if (!/^https?:\/\//i.test(base)) base = 'https://' + base;
      /* 家长很可能把 Supabase 页面上的 /rest/v1/ 一起复制进来，容错一下 */
      base = base.replace(/\/rest\/v1$/i, '').replace(/\/+$/, '');
      return base + '/rest/v1/beans';
    },

    headers: function (extra) {
      var h = {
        apikey: S.data.cloudKey,
        Authorization: 'Bearer ' + S.data.cloudKey,
        'Content-Type': 'application/json'
      };
      if (extra) for (var k in extra) h[k] = extra[k];
      return h;
    },

    setStatus: function (st, msg) {
      this.status = st;
      this.message = msg || '';
      if (G.App && G.App.onCloudStatus) G.App.onCloudStatus();
    },

    /* 把 HTTP 状态码翻译成人话，方便家长自己排查 */
    explainError: function (status) {
      if (status === 404) return '找不到数据表 beans —— SQL 那段还没跑成功（或者跑到了别的项目里）';
      if (status === 401 || status === 403) return 'anon key 不对，或者 SQL 里的策略没建好';
      if (status === 400) return '请求被数据库拒绝，通常是 SQL 里的策略没建好';
      if (status === 0) return '连不上网络';
      return 'HTTP ' + status;
    },

    init: function () {
      if (!this.configured()) {
        this.setStatus('off', '未配置（数据只存在这台设备上）');
        return;
      }
      this.setStatus('idle', '已配置，准备同步');

       ============================================================ */
    newQuestion: function () {
      /* 带 ?seed= 时完全确定（截图/测试用）；正常玩的时候用随机种子 */
      var seed = this.state.seed || ((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
      var opt = this.state.opt;
      var q = G.nextQuestion({
        grade: opt.grade, stars: opt.stars, topic: opt.topic,
        customList: Store.data.custom
      }, seed, Store.recentIds());
      if (q && q.genId && q.genId !== 'custom') Store.addRecent(q.genId);
      this.state.quiz = q;
      this.state.input = '';
      this.state.phase = 'answer';
      this.state.attempts = 0;
      this.state.revealed = false;
      this.state.result = null;
    },

    submit: function () {
      var st = this.state;
      if (st.phase !== 'answer') return;
      if (st.input === '') { FX.toast('先输入答案哦', 'warn'); return; }
      var val = parseInt(st.input, 10);
      var ok = (val === st.quiz.answer);
      st.attempts++;

      if (ok) {
        var r = Store.award(st.quiz.stars);
        st.result = r;
        st.phase = 'correct';
        Sound.correct();
        if (r.gained > 0) Sound.bean();
        if (Store.data.streak >= 3) Sound.streak(Store.data.streak);

        /* 特效：在答案区域放彩屑；拿到豆子就让豆子飞进钱包 */
        var rect = this.view.querySelector('.answer-box');
        var cx = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
        var cy = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;
        FX.burst(cx, cy, { count: 30, speed: 380 });
        if (r.gained > 0) {
          Sound.bean();
          var target = document.querySelector('[data-nav="wallet"]');
          for (var i = 0; i < r.gained; i++) {
            (function (k) {
              setTimeout(function () {
                FX.beanFly(cx, cy - 20, target, function () {
                  var cur = document.querySelector('.wallet-beans-num');
                  if (cur) { cur.classList.remove('pop'); void cur.offsetWidth; cur.classList.add('pop'); }
                });
              }, k * 140);
            })(i);
          }
        }
      } else {
        /* 严格模式下先给孩子一次重来的机会，但不告诉他答案 */
        if (!Store.kidCanSeeAnswer() && !st.revealed && st.attempts < 2) {
          Sound.wrong();
          FX.toast('不对哦，再想想～', 'warn');
          st.input = '';
        } else {
          Store.miss(st.quiz.stars);
          st.phase = 'wrong';
          Sound.wrong();
        }
      }
      this.render();
    },

    giveUp: function () {
      if (this.state.phase !== 'answer') return;
      Store.miss(this.state.quiz.stars);
      this.state.phase = 'skipped';
      this.state.input = '';
      Sound.wrong();
      this.render();
    },

    key: function (k) {
      var st = this.state;
      if (st.phase !== 'answer') return;
      Sound.click();
      if (k === 'del') { st.input = st.input.slice(0, -1); }
      else if (k === 'clear') { st.input = ''; }
      else if (st.input.length < 6) { st.input = (st.input === '0' ? '' : st.input) + k; }
      this.updateAnswerBox();
    },

    updateAnswerBox: function () {
      var box = this.view.querySelector('.answer-value');
      if (box) {
        box.textContent = this.state.input === '' ? '?' : U.fmt(this.state.input);
        box.classList.toggle('empty', this.state.input === '');
      }
      var btn = this.view.querySelector('.pad-submit');
      if (btn) btn.classList.toggle('ready', this.state.input !== '');
    },

    /* ============================================================
       渲染
       ============================================================ */
    render: function () {
      var st = this.state;
      U.clear(this.root);
      this.root.className = 'view view-' + st.view;

      if (st.view === 'home') this.root.appendChild(this.viewHome());
      else if (st.view === 'quiz') this.root.appendChild(this.viewQuiz());
      else if (st.view === 'wallet') this.root.appendChild(this.viewWallet());
      else if (st.view === 'gate') this.root.appendChild(this.viewGate());
      else if (st.view === 'parent') this.root.appendChild(this.viewParent());
      else if (st.view === 'report') this.root.appendChild(this.viewReport());

      /* 报告模式不显示底部导航 */
      this.tabs.style.display = (st.view === 'report') ? 'none' : '';

      /* 底部导航高亮 */
      var nav = st.view === 'quiz' ? 'quiz' : (st.view === 'wallet' ? 'wallet' :
        (st.view === 'parent' || st.view === 'gate' ? 'parent' : 'home'));
      U.$$('[data-nav]', this.tabs).forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-nav') === nav);
      });

      this.view = this.root;
    },

    /* ---------- 做题 ---------- */
    viewQuiz: function () {
      var st = this.state, self = this;
      if (!st.quiz) this.newQuestion();
      var q = st.quiz;

      var stars = '';
      for (var i = 0; i < q.stars; i++) stars += '★';

      /* 孩子能不能看到答案：由家长设置决定；家长用密码解锁后也可以临时看 */
      var showAnswer = (st.phase === 'correct') ||
        ((st.phase === 'wrong' || st.phase === 'skipped') && (Store.kidCanSeeAnswer() || st.revealed));

      var head = el('div', { class: 'quiz-head' }, [
        el('span', { class: 'tag', text: q.topicName }),
        el('span', { class: 'tag tag-star', text: stars + ' 本题 ' + q.stars + ' 分' })
      ]);

      var qText = q.q.split('\n').map(function (line) {
        return el('div', { class: 'q-line', text: line });
      });

      var answerArea;
      if (st.phase === 'answer') {
        answerArea = el('div', { class: 'answer-box' }, [
          el('div', { class: 'answer-label', text: st.attempts > 0 ? '再想想，重新填一个答案' : '你的答案' }),
          el('div', { class: 'answer-value empty', text: '?' })
        ]);
      } else if (st.phase === 'correct') {
        var r = st.result;
        answerArea = el('div', { class: 'answer-box ok' }, [
          el('div', { class: 'answer-label', text: '答对啦！' }),
          el('div', { class: 'answer-value', text: U.fmt(q.answer) }),
          el('div', { class: 'answer-note' }, [
            '+' + q.stars + ' 分',
            r.gained > 0 ? el('span', { class: 'got-bean' }, ['　',
              el('span', { class: 'inline-bean', html: beanIcon(22) }), '　',
              el('b', { text: '得到 ' + r.gained + ' 颗豆！' })]) : null
          ])
        ]);
      } else if (showAnswer) {
        answerArea = el('div', { class: 'answer-box no' }, [
          el('div', { class: 'answer-label', text: '正确答案' }),
          el('div', { class: 'answer-value', text: U.fmt(q.answer) })
        ]);
      } else {
        /* 严格模式：只告诉孩子没做对，不给答案 */
        answerArea = el('div', { class: 'answer-box no' }, [
          el('div', { class: 'answer-label', text: st.phase === 'skipped' ? '这题先跳过了' : '这次没做对' }),
          el('div', { class: 'answer-note', text: '想一想哪里卡住了，可以问爸爸妈妈一起看～' }),
          el('div', { class: 'answer-note small', text: '答案只有家长能看到' })
        ]);
      }

      var explain = null;
      if (showAnswer) {
        explain = el('div', { class: 'card explain' }, [
          el('div', { class: 'card-title', text: '解题思路' }),
          el('div', { class: 'explain-body' }, String(q.explain || '').split('\n').map(function (l) {
            return el('div', { text: l });
          }))
        ]);
      }

      var pad, actions;

      if (st.phase === 'answer') {
        var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'del'];
        pad = el('div', { class: 'pad' },
          keys.map(function (k) {
            return el('button', {
              class: 'pad-key' + (k === 'clear' || k === 'del' ? ' pad-fn' : ''),
              text: k === 'clear' ? '清空' : (k === 'del' ? '⌫' : k),
              onclick: function () { self.key(k); }
            });
          }).concat([
            el('button', { class: 'pad-key pad-submit', text: '提交', onclick: function () { self.submit(); } })
          ])
        );
        actions = el('div', { class: 'quiz-actions' }, [
          el('button', {
            class: 'btn-ghost', text: '跳过这题',
            onclick: function () { self.giveUp(); }
          }),
          el('button', {
            class: 'btn-ghost', text: '换一题',
            onclick: function () { Sound.click(); self.newQuestion(); self.render(); }
          })
        ]);
      } else {
        var canRetry = (st.phase === 'wrong' && st.attempts < 2 && !st.revealed);
        pad = el('div', { class: 'pad-actions' }, [
          canRetry
            ? el('button', {
                class: 'btn-primary big', text: '再试一次',
                onclick: function () {
                  Sound.click();
                  st.phase = 'answer';
                  st.input = '';
                  self.render();
                }
              })
            : el('button', {
                class: 'btn-primary big', text: '下一题 →',
                onclick: function () { Sound.click(); self.newQuestion(); self.render(); }
              })
        ]);
        actions = el('div', { class: 'quiz-actions' }, [
          canRetry
            ? el('button', {
                class: 'btn-ghost', text: '下一题',
                onclick: function () { Sound.click(); self.newQuestion(); self.render(); }
              })
            : null,
          (!showAnswer)
            ? el('button', {
                class: 'btn-ghost', text: '🔒 家长查看答案',
                onclick: function () {
                  Sound.click();
                  st.gateMode = 'reveal';
                  st.gateInput = '';
                  st.view = 'gate';
                  self.render();
                }
              })
            : null
        ]);
      }

      return el('div', { class: 'page' }, [head, el('div', { class: 'qtext' }, qText),
        answerArea, explain, actions, pad,
        (st.phase === 'answer') ? null : this.beanProgressBar()]);
    },

          ]),

    /* ---------- 家长密码 ---------- */
    viewGate: function () {
      var self = this;
      var st = this.state;
      var dots = el('div', { class: 'pin-dots' }, [0, 1, 2, 3].map(function (i) {
        return el('span', { class: 'dot' + (st.gateInput.length > i ? ' on' : '') });
      }));

      function press(k) {
        Sound.click();
        if (k === 'del') st.gateInput = st.gateInput.slice(0, -1);
        else if (st.gateInput.length < 6) st.gateInput += k;
        if (st.gateInput.length >= 4 && st.gateInput === Store.data.pin) {
          if (st.gateMode === 'reveal') {
            /* 家长解锁本题答案，回到做题界面 */
            st.revealed = true;
            st.gateMode = 'parent';
            st.view = 'quiz';
          } else {
            st.unlocked = true;
            st.view = 'parent';
          }
          st.gateInput = '';
          self.render();
          return;
        }
        if (st.gateInput.length >= 6 && st.gateInput !== Store.data.pin) {
          FX.toast('密码不对', 'warn');
          st.gateInput = '';

        }

      }

      return el('div', { class: 'page center' }, [
        el('div', { class: 'card gate' }, [
          el('div', { class: 'card-title big-title', text: '👨‍👩‍👧 家长模式' }),
          el('div', { class: 'muted', text: '请输入家长密码（默认 0000）' }),
          dots,
          el('div', { class: 'pad pin-pad' }, ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'del'].map(function (k) {
            return el('button', {
              class: 'pad-key' + (k === 'clear' || k === 'del' ? ' pad-fn' : ''),

              onclick: function () { press(k); }
            });
          })),
          el('button', { class: 'btn-ghost', text: '返回', onclick: function () {
            self.state.view = 'home'; self.render();
          } })
        ])
      ]);
    },

    /* ---------- 家长面板 ---------- */
    viewParent: function () {
      var d = Store.data, self = this;

      function beanRow(delta) {
        return el('button', {
          class: 'btn-ghost small', text: (delta > 0 ? '+' : '') + delta,

          }

      }

      var customInput = el('input', {
        class: 'input', type: 'tel', inputmode: 'numeric', placeholder: '数量',
        style: { width: '110px' }
      });

      var rateInput = el('input', {
        class: 'input', type: 'tel', inputmode: 'numeric', value: String(d.pointsPerBean),
        style: { width: '80px' }

      var goalNameInput = el('input', { class: 'input', type: 'text', value: d.goalName, placeholder: '比如：去游乐园' });

        style: { width: '100px' }
      });

      var pinInput = el('input', {
        class: 'input', type: 'tel', inputmode: 'numeric', placeholder: '新的 4~6 位数字',
        style: { width: '180px' }
      });

      var exportBox = el('textarea', { class: 'textarea', rows: 5, readonly: true });

      var importBox = el('textarea', { class: 'textarea', rows: 4, placeholder: '把备份内容粘贴到这里，再点「导入」' });

      var kidNameInput = el('input', {
        class: 'input', type: 'text', value: d.kidName, placeholder: '比如：小明'
      });

      var reportBox = el('textarea', { class: 'textarea', rows: 3, readonly: true });
      reportBox.value = Store.reportUrl();

      var cqQ = el('input', { class: 'input', type: 'text', placeholder: '题干（例如：一个数除以 7 余 3……）' });
      var cqA = el('input', {
        class: 'input', type: 'tel', inputmode: 'numeric', placeholder: '答案（只能填数字）',
        style: { maxWidth: '180px' }
      });
      var cqS = el('select', { class: 'input', style: { maxWidth: '150px' } }, [
        el('option', { value: '1', text: '★ 简单（1 分）' }),
        el('option', { value: '2', text: '★★ 中等（2 分）', selected: true }),
        el('option', { value: '3', text: '★★★ 挑战（3 分）' })
      ]);
      var cqE = el('input', { class: 'input', type: 'text', placeholder: '解题思路（可留空）' });

      /* ---- 云同步相关控件 ---- */
      var cloudUrlInput = el('input', {
        class: 'input', type: 'text', value: d.cloudUrl,
        placeholder: 'https://xxxx.supabase.co'
      });
      var cloudKeyInput = el('input', {
        class: 'input', type: 'text', value: d.cloudKey,
        placeholder: 'anon public key（一长串）'

      var cloudCodeInput = el('input', {
        class: 'input', type: 'text', value: d.cloudCode,
        placeholder: '家庭同步码，例如 BEAN2024HOME'
      });

      var SQL = [
        'create table if not exists beans (',
        '  code text primary key,',
        '  data jsonb not null,',
        '  updated_at timestamptz not null default now()',
        ');',
        'alter table beans enable row level security;',
        'drop policy if exists "family" on beans;',
        'create policy "family" on beans for all using (true) with check (true);'
      ].join('\n');
      var sqlBox = el('textarea', { class: 'textarea', rows: 9, readonly: true });
      sqlBox.value = SQL;

      var syncBox = el('textarea', { class: 'textarea', rows: 3, readonly: true });
      var syncImport = el('textarea', {
        class: 'textarea', rows: 3,
        placeholder: '把另一台设备生成的同步码粘贴到这里，再点下面的按钮'

      function cloudBtn(text, fn) {
        return el('button', { class: 'btn-ghost small', text: text, onclick: fn });
      }

      return el('div', { class: 'page' }, [
        el('div', { class: 'card' }, [

          el('div', { class: 'btn-row' }, [beanRow(1), beanRow(5), beanRow(10), beanRow(-1), beanRow(-5)]),
          el('div', { class: 'field-row' }, [
            el('span', { class: 'field-label', text: '自定义增减：' }),
            customInput,
            el('button', {
              class: 'btn-ghost small', text: '加',
              onclick: function () {
                var n = parseInt(customInput.value, 10);
                if (!n) { FX.toast('请输入数字', 'warn'); return; }

                FX.toast('加了 ' + n + ' 颗豆');
                self.render();
              }
            }),
            el('button', {
              class: 'btn-ghost small', text: '减',

                var n = parseInt(customInput.value, 10);

                Store.addBeans(-n, '家长手动调整');

                self.render();
              }
            })

          el('div', { class: 'muted small', text: '「减」会自动停在 0，不会变成负数。' })
        ]),

        el('div', { class: 'card' }, [
          el('div', { class: 'card-title', text: '⚖️ 奖励规则' }),
          el('div', { class: 'field-row' }, [
            el('span', { class: 'field-label', text: '每' }),
            rateInput,
            el('span', { class: 'field-label', text: '分换 1 颗豆' }),
            el('button', {
              class: 'btn-ghost small', text: '保存',
              onclick: function () {

          el('div', { class: 'muted small', text: '题目分值：★ = 1 分，★★ = 2 分，★★★ = 3 分。设为 2 就是「做对 2 道基础题得 1 颗豆」。' })

        el('div', { class: 'card' }, [

          el('div', { class: 'field-row' }, [

            el('button', {
              class: 'btn-ghost small', text: '保存',

        el('div', { class: 'card' }, [

          el('div', { class: 'cloud-status cloud-' + (G.Cloud ? G.Cloud.status : 'off') ,

          el('div', { class: 'field-row' }, [
            el('span', { class: 'field-label', text: '数据库网址：' }), cloudUrlInput
          ]),
          el('div', { class: 'field-row' }, [
            el('span', { class: 'field-label', text: 'anon key：' }), cloudKeyInput
          ]),
          el('div', { class: 'field-row' }, [
            el('span', { class: 'field-label', text: '家庭同步码：' }), cloudCodeInput,
            cloudBtn('随机生成', function () {
              cloudCodeInput.value = Store.newCloudCode();
              FX.toast('已生成，几台设备填同一个');
            })
          ]),
          el('div', { class: 'btn-row' }, [
            cloudBtn('保存并同步', function () {
              G.Cloud.saveConfig(cloudUrlInput.value, cloudKeyInput.value, cloudCodeInput.value,
                function () { self.render(); });
              FX.toast('正在同步…');
            }),
            cloudBtn('立即拉取', function () {
              G.Cloud.pull(function () { self.render(); });
            }),
            cloudBtn('立即上传', function () {
              G.Cloud.push(function () { self.render(); });
            })
          ]),
          (function () {
            var box = el('details', { class: 'howto' }, [
              el('summary', { text: '▼ 怎么开通（免费，约 3 分钟，只需做一次）' }),
              el('div', { class: 'howto-body' }, [
                el('div', { text: '1. 打开 supabase.com 注册（免费），新建一个项目（区域选近的）' }),
                el('div', { text: '2. 左边点 SQL Editor → New query，把下面这段全部粘进去，点 Run：' }),
                sqlBox,
                el('button', {
                  class: 'btn-ghost small', text: '复制这段 SQL',
                  onclick: function () {
                    sqlBox.select();
                    try { document.execCommand('copy'); FX.toast('SQL 已复制'); }
                    catch (e) { FX.toast('请长按选择复制', 'warn'); }
                  }
                }),
                el('div', { text: '3. 左边点 Project Settings（齿轮）→ API，复制 Project URL 和 anon public key' }),
                el('div', { text: '4. 填到上面三个框里，点「保存并同步」' }),
                el('div', { text: '5. 在 iPad 上打开同一个网址，填一样的三项，就同步了' }),
                el('div', { class: 'muted small', text: '说明：anon key 本来就是给浏览器用的公开钥匙，放在这里不危险；' +
                  '真正的门锁是「家庭同步码」，请设长一点、别用太好猜的。' })
              ])
            ]);
            if (self.state.openCloudHelp) box.setAttribute('open', '');
            return box;
          })()
        ]),

        el('div', { class: 'card' }, [
          el('div', { class: 'card-title', text: '🔁 手动同步码（不想配云的时候用这个）' }),
          el('div', { class: 'muted small', text: '在 iPad 上生成一段同步码，发到电脑上粘贴进来，' +
            '两台设备的豆子就一样了。反过来也成立。' }),
          el('div', { class: 'btn-row' }, [
            cloudBtn('生成并复制同步码', function () {
              syncBox.value = Store.syncCode();
              syncBox.select();
              try { document.execCommand('copy'); FX.toast('已复制，去另一台设备粘贴'); }
              catch (e) { FX.toast('请长按选择复制', 'warn'); }
            })
          ]),
          syncBox,
          syncImport,
          el('div', { class: 'btn-row' }, [
            cloudBtn('用这段同步码覆盖本机', function () {
              var err = Store.applySyncCode(syncImport.value);
              if (err) { FX.toast(err, 'warn'); return; }
              FX.toast('已导入，豆子已更新');
              self.render();
            })
          ])
        ]),

        el('div', { class: 'card' }, [
          el('div', { class: 'card-title', text: '🔒 答案权限' }),
          el('div', { class: 'muted small', text: '孩子做完题以后，能不能看到正确答案和解题思路。' }),
          el('div', { class: 'chips', style: { marginTop: '8px' } }, [
            ['strict', '严格：只有家长能看'],
            ['gentle', '温和：答错后给孩子看']
          ].map(function (m) {
            return el('button', {
              class: 'chip' + (d.answerMode === m[0] ? ' on' : ''),
              text: m[1],
              onclick: function () {
                Sound.click();
                Store.setAnswerMode(m[0]);
                FX.toast('已切换');
                self.render();
              }
            });
          })),
          el('div', { class: 'muted small', text: '严格模式下孩子只看到「对 / 没做对」，还能重试一次；' +
            '你想看答案时，在做题界面点「家长查看答案」输密码就行。' })
        ]),

        el('div', { class: 'card' }, [
          el('div', { class: 'card-title', text: '👶 孩子名字' }),
          el('div', { class: 'field-row' }, [
            kidNameInput,
            el('button', {
              class: 'btn-ghost small', text: '保存',
              onclick: function () {
                Store.setKidName(kidNameInput.value);
                FX.toast('已保存');
                self.render();
              }
            })
          ])
        ]),

        el('div', { class: 'card' }, [
          el('div', { class: 'card-title', text: '📤 家长报告（任何电脑都能看）' }),
          el('div', { class: 'muted small', text: '生成一条链接，复制到微信或邮件里，' +
            '在任何一台电脑、手机上打开都能看到孩子的进度 —— 只读，而且不需要服务器，数据全在链接里。' }),
          reportBox,
          el('div', { class: 'btn-row' }, [
            el('button', {
              class: 'btn-ghost small', text: '刷新',
              onclick: function () { reportBox.value = Store.reportUrl(); FX.toast('已刷新'); }
            }),
            el('button', {
              class: 'btn-ghost small', text: '复制链接',
              onclick: function () {
                reportBox.value = Store.reportUrl();
                reportBox.select();
                try { document.execCommand('copy'); FX.toast('已复制，发给别人就能看'); }
                catch (e) { FX.toast('请长按选择复制', 'warn'); }
              }
            }),
            el('button', {
              class: 'btn-ghost small', text: '本机预览',
              onclick: function () {
                window.location.hash = '#report=' + Store.reportCode();
                window.location.reload();
              }
            })
          ])
        ]),

        el('div', { class: 'card' }, [
          el('div', { class: 'card-title', text: '✍️ 家长自己出题' }),
          el('div', { class: 'muted small', text: '可以把孩子正在用的练习册上的题录入进来（答案只有你能看到）。' +
            '注意：答案必须是数字，因为孩子是用数字键盘作答的。' }),
          cqQ, cqA,
          el('div', { class: 'field-row' }, [
            el('span', { class: 'field-label', text: '难度：' }), cqS,
            el('button', {
              class: 'btn-ghost small', text: '添加这道题',
              onclick: function () {
                var err = Store.addCustom(cqQ.value, cqA.value, cqS.value, cqE.value);
                if (err) { FX.toast(err, 'warn'); return; }
                FX.toast('已添加');
                self.render();
              }
            })
          ]),
          cqE,
          d.custom.length
            ? el('div', { class: 'custom-list' }, d.custom.map(function (c, i) {
                return el('div', { class: 'custom-item' }, [
                  el('div', { class: 'custom-q', text: c.q }),
                  el('div', { class: 'custom-meta' }, [
                    el('span', { text: '答案 ' + c.a + ' · ' + '★'.repeat(c.s) }),
                    el('button', {
                      class: 'btn-danger small', text: '删除',
                      onclick: function () { Store.removeCustom(i); self.render(); }
                    })
                  ])
                ]);
              }))
            : el('div', { class: 'muted small', text: '还没有自己出的题。' })
        ]),

        el('div', { class: 'card' }, [
          el('div', { class: 'card-title', text: '📊 学习统计' }),
          el('div', { class: 'stats-grid' }, [
            el('div', { class: 'stat' }, [el('b', { text: String(d.stats.total) }), el('span', { text: '总题数' })]),
            el('div', { class: 'stat' }, [el('b', { text: String(d.stats.correct) }), el('span', { text: '答对' })]),
            el('div', { class: 'stat' }, [el('b', { text: Store.accuracy() + '%' }), el('span', { text: '正确率' })]),
            el('div', { class: 'stat' }, [el('b', { text: String(d.bestStreak) }), el('span', { text: '最长连对' })])
          ]),
          el('div', { class: 'stars-stat' }, [
            this.starStat('★ 简单', d.stats.s1),
            this.starStat('★★ 中等', d.stats.s2),
            this.starStat('★★★ 挑战', d.stats.s3)
          ])
        ]),

        el('div', { class: 'card' }, [
          el('div', { class: 'card-title', text: '🔒 家长密码' }),
          el('div', { class: 'field-row' }, [
            pinInput,
            el('button', {
              class: 'btn-ghost small', text: '修改',
              onclick: function () {
                if (Store.setPin(pinInput.value)) { FX.toast('密码已修改'); pinInput.value = ''; }
                else FX.toast('密码要 4~6 位数字', 'warn');
              }
            })
          ]),
          el('div', { class: 'field-row' }, [
            el('button', {
              class: 'btn-ghost small', text: (d.sound ? '🔔 音效：开' : '🔕 音效：关'),
              onclick: function () { Store.setSound(!Store.data.sound); self.render(); }
            }),
            el('button', {
              class: 'btn-ghost small', text: '退出家长模式',
              onclick: function () { self.state.unlocked = false; self.state.view = 'home'; self.render(); }
            })
          ])
        ]),

        el('div', { class: 'card' }, [
          el('div', { class: 'card-title', text: '💾 备份与重置' }),
          el('div', { class: 'muted small', text: '导出的内容可以复制保存；换设备时粘贴到下面再导入。' }),
          exportBox,
          el('div', { class: 'btn-row' }, [
            el('button', {
              class: 'btn-ghost small', text: '复制导出内容',
              onclick: function () {
                exportBox.select();
                try { document.execCommand('copy'); FX.toast('已复制'); }
                catch (e) { FX.toast('请长按选择复制', 'warn'); }
              }
            }),
            el('button', {
              class: 'btn-ghost small', text: '刷新导出内容',
              onclick: function () { exportBox.value = Store.exportText(); FX.toast('已刷新'); }

          ]),
          importBox,
          el('div', { class: 'btn-row' }, [
            el('button', {
              class: 'btn-ghost small', text: '导入',

                var err = Store.importText(importBox.value);

                else { FX.toast('导入成功'); self.render(); }
              }
            }),
            el('button', {
              class: 'btn-danger small', text: '清空所有进度',
              onclick: function () {
                if (window.confirm('确定要清空所有豆子和记录吗？这个操作不能撤销。')) {
                  Store.reset();
                  FX.toast('已清空');
                  self.state.view = 'home';
                  self.render();
                }
              }
            })
          ])
        ])
      ]);
    }
  };

  G.App = App;
})(window.G);

</script>
  <script>
/* ===== main.js ===== */
/* 奥数豆豆 — 启动 */
window.G = window.G || {};
(function (G) {
  'use strict';
  function boot() {
    try {
      G.App.start();
      G.booted = true;
    } catch (e) {
      var v = document.getElementById('view');
      if (v) v.textContent = '启动失败：' + e.message;
      if (window.console) console.error(e);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.G);

</script>
</body>
</html>
